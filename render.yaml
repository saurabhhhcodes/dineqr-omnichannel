services:
  - type: web
    name: dineqr-platform
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    disk:
      name: dineqr-sqlite-data
      mountPath: /data
      sizeGB: 1
