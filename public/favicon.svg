  <path d="M14 12.5v2.2m.8-2.2v2.2m.8-2.2v2.2m-1.6 2.2a1 1 0 0 0 1.6 0v2.8" stroke="#090d16" stroke-width="0.85" stroke-linecap="round"/>
  <!-- Knife Silhouette -->
