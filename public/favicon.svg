      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- QR Code Framing Box with High-Tech Corner Notches -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#090d16" stroke="url(#amberGlow)" stroke-width="2.5"/>
  
  <!-- 3 QR Finder Target Markers -->
  <rect x="5" y="5" width="6" height="6" rx="1.5" fill="#f59e0b"/>
  <rect x="21" y="5" width="6" height="6" rx="1.5" fill="#f59e0b"/>
  <rect x="5" y="21" width="6" height="6" rx="1.5" fill="#f59e0b"/>
  
  <!-- QR Data Bits -->
