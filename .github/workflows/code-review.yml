name: Autonomous Code Review & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-review:
    name: Autonomous Code Review Bot & Postman API Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🤖 Run Autonomous Code Review Bot
        run: npm run code-review

      - name: ⚡ Run Vite Production Build Check
        run: npm run build

      - name: 🚀 Start Local SQLite POS Server for Integration Testing
        run: |
          PORT=3005 node server/index.js &
          sleep 3

      - name: 🧪 Run Automated Postman API Test Suite (24 Endpoints)
        run: node tests/run_postman_suite.js
